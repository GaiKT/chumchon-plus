services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chumchon
      POSTGRES_USER: chumchon_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:?set OWNER_DB_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    # Bound to localhost only so migrations and scripts can run from the host
    # during development. Production compose must not publish this port.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chumchon_owner -d chumchon"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://chumchon_app:${APP_DB_PASSWORD}@db:5432/chumchon
      DEV_VILLAGE_ID: ${DEV_VILLAGE_ID:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
